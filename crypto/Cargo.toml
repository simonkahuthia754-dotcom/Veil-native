[package]
name = "veil-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core crypto + local secure storage for Veil clients. No custom cryptography: every primitive here is a standard, widely-reviewed crate, not a hand-rolled algorithm."

[dependencies]
# Classical half of the hybrid key exchange — X25519 ECDH, from the
# well-established dalek-cryptography project.
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Post-quantum half: ML-KEM-768 (the NIST-standardized algorithm formerly
# known as Kyber). Used ALONGSIDE X25519, never instead of it — a
# classical+PQ hybrid is the real-world recommended transition path (the
# same approach behind Signal's PQXDH and Chrome's post-quantum TLS), not a
# PQ-only scheme nobody has had years to attack yet.
#
# Pinned to 0.3.3 deliberately, not 0.2.x: this crate's public API changed
# materially between those lines (0.2.x exposed a `KemCore` trait; 0.3.x
# renamed/restructured it to `Kem`/`Encapsulate`/`Decapsulate` re-exported
# from the separate `kem` crate). 0.2 was the original guess, written
# without registry access to check it, and it was wrong — confirmed by
# real CI compiler errors, then corrected here against the actual published
# source (docs.rs + the `kem`/`ml_kem` crates' own lib.rs), not guessed
# again. The "getrandom" feature is required for the non-deterministic
# `generate_keypair()`/`encapsulate()` methods used in e2e.rs — this
# crate's default features are deliberately empty, so it must be named
# explicitly.
ml-kem = { version = "0.3.3", features = ["getrandom"] }

# Combines the two shared secrets into one symmetric key.
hkdf = "0.12"
sha2 = "0.10"

# Authenticated encryption for both messages and local secret-at-rest
# storage, keyed by the hybrid-derived secret above.
chacha20poly1305 = "0.10"

# Password/PIN/passphrase hashing — OWASP's current recommendation, the
# same primitive the backend already uses server-side.
argon2 = "0.5"

rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
