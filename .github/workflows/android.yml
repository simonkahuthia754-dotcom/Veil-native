name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"

jobs:
  build:
    name: assembleDebug + lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `ubuntu-latest` GitHub-hosted runners already ship with an Android
      # SDK preinstalled (ANDROID_HOME/ANDROID_SDK_ROOT set, `sdkmanager` on
      # PATH) — that's the standard, documented setup for Android CI on
      # these images. A previous version of this workflow instead used the
      # third-party `android-actions/setup-android@v3` action, which failed
      # outright ("Set up Android SDK" step, conclusion: failure) rather
      # than installing anything. Dropped in favor of just accepting
      # licenses and letting Gradle's own dependency resolution pull
      # whichever compileSdk/buildTools version android/app/build.gradle.kts
      # asks for — one less moving part, and the actual documented
      # mechanism rather than a flaky wrapper around it.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # No gradlew wrapper jar is committed yet (this project was scaffolded
      # in an environment with no network access to generate one honestly —
      # see repo root README "Honest gaps"). setup-gradle provisions a
      # pinned `gradle` binary instead, which is why these steps call
      # `gradle` directly rather than `./gradlew`. Replacing this with a
      # real committed wrapper (`gradle wrapper --gradle-version 8.9`) is a
      # tracked follow-up, not an oversight.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint
        run: gradle lint --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
