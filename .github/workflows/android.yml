name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"

jobs:
  build:
    name: assembleDebug + lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No gradlew wrapper jar is committed yet (this project was scaffolded
      # in an environment with no network access to generate one honestly —
      # see repo root README "Honest gaps"). setup-gradle provisions a
      # pinned `gradle` binary instead, which is why these steps call
      # `gradle` directly rather than `./gradlew`. Replacing this with a
      # real committed wrapper (`gradle wrapper --gradle-version 8.9`) is a
      # tracked follow-up, not an oversight.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint
        run: gradle lint --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
